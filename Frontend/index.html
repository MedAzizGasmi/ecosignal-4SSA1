<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoSignal — Hello Services</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <div class="logo">E</div>
      <div>
        <p class="eyebrow">ECOSIGNAL · AWD</p>
        <h1>Test des microservices</h1>
        <p class="subtitle">Vérifier l'endpoint Hello de chaque microservice.</p>

    <section class="services" id="services" aria-label="Réponses des microservices"></section>

  </main>
  <script src="app.js"></script>
